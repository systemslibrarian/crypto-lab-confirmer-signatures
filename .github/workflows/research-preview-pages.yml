name: Research preview — ECDSA, symbolic and real BLS12-381 math
on:
  pull_request:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'tests/**'
      - 'research/dcs-uv-symbolic.mjs'
      - 'research/real-pairing/**'
      - '.github/workflows/research-preview-pages.yml'
      - '.github/workflows/confirmer-formal-proof.yml'
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'research/dcs-uv-symbolic.mjs'
      - 'research/real-pairing/**'
      - '.github/workflows/research-preview-pages.yml'
      - '.github/workflows/confirmer-formal-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: signature-research-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-formal-model:
    uses: ./.github/workflows/confirmer-formal-proof.yml

  prove-scope-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Real ECDSA and research-only unit tests
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs | tee /tmp/tests.tap
          grep -Eq '^# tests (11[3-9]|1[2-9][0-9]|[2-9][0-9]{2,})$' /tmp/tests.tap
      - name: Install, test and build genuine BLS12-381 Type-3 research
        working-directory: research/real-pairing
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --ignore-scripts
          npm test
          npm run build
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Browser test dependencies
        run: |
          python -m pip install playwright==1.57.0 -r research/real-pairing/reference/requirements.txt
          python -m playwright install chromium
      - name: Reproduce vectors and check with a separate library and symbolic algebra
        run: |
          set -euo pipefail
          node research/real-pairing/reference/generate-vectors.mjs --check
          python -m unittest discover -s research/real-pairing/reference -p 'test_reference.py' -v
          python research/real-pairing/reference/check_algebra.py
      - name: Play genuine ECDSA and source-specific symbolic OR math at both widths
        run: python -m unittest discover -s tests -p 'browser_flow.py' -v
      - name: Execute REAL pairing experience in actual mobile and desktop browsers
        run: python -m unittest discover -s tests -p 'real_pairing_browser.py' -v
      - name: Package only tested research chapters with scoped security claims
        run: |
          set -euo pipefail
          test ! -e prototype/dcs.mjs
          test ! -e prototype/confirmer.mjs
          grep -Fq 'Chapter 01 is working. The full confirmer protocol is still being built.' prototype/index.html
          grep -Fq 'The separate protocol where Carol proves a signature valid or invalid is <b>not yet implemented</b>' prototype/index.html
          grep -Fq '<small>NOT IMPLEMENTED</small>' prototype/index.html
          mkdir -p dist
          cp prototype/entry.html dist/index.html
          cp prototype/index.html dist/ordinary.html
          cp prototype/style.css prototype/app.mjs prototype/crypto.mjs dist/
          mkdir -p dist/symbolic
          cp prototype/symbolic/index.html prototype/symbolic/app.mjs dist/symbolic/
          cp research/dcs-uv-symbolic.mjs dist/symbolic/dcs-uv-symbolic.mjs
          cmp -s research/dcs-uv-symbolic.mjs dist/symbolic/dcs-uv-symbolic.mjs
          grep -Fq 'NOT SECURE CRYPTOGRAPHY OR A FINISHED DESIGNATED CONFIRMER SIGNATURE' dist/symbolic/index.html
          grep -Fq 'does <b>not</b> implement disavowal' dist/symbolic/index.html
          grep -Fq 'id="attack-lab"' dist/symbolic/index.html
          grep -Fq 'id="forge"' dist/symbolic/index.html
          grep -Fq 'forgeWithKnownChallenge' dist/symbolic/dcs-uv-symbolic.mjs
          grep -Fq 'interactive 2013 OR-confirmation workbench' dist/ordinary.html
          grep -Fq 'content="0; url=./real/"' dist/index.html
          touch dist/.nojekyll
          test -s dist/real/index.html
          grep -Fq 'REAL CRYPTOGRAPHIC ARITHMETIC — NOT A FINISHED OR SECURITY-PROVEN DCS' dist/real/index.html
          REAL_ASSET="$(find dist/real/assets -maxdepth 1 -type f -name '*.js' | head -n 1)"
          test -s "$REAL_ASSET"
          REAL_ASSET_NAME="$(basename "$REAL_ASSET")"
          REAL_SHA="$(sha256sum "$REAL_ASSET" | cut -d' ' -f1)"
          SYMBOLIC_SHA="$(sha256sum dist/symbolic/dcs-uv-symbolic.mjs | cut -d' ' -f1)"
          printf '{"source_sha":"%s","scope":"ecdsa-symbolic-and-real-pairing-research-only","repository":"%s","symbolic_sha256":"%s","real_asset":"%s","real_sha256":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$SYMBOLIC_SHA" "$REAL_ASSET_NAME" "$REAL_SHA" > dist/revision.json
          test ! -e dist/research
          test ! -e dist/tests
          echo "Research preview ready: candidate inequality evidence is scoped; no complete or security-proven DCS is claimed."
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with: { path: dist }

  publish-preview:
    if: github.event_name != 'pull_request'
    needs: [prove-scope-and-build, check-formal-model]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v5
      - name: Confirm that PUBLIC Pages serves this exact reviewed preview
        env:
          SITE: https://systemslibrarian.github.io/crypto-lab-confirmer-signatures/
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            url="${SITE}revision.json?audit=${GITHUB_SHA}-${i}"
            if curl -fsSL --connect-timeout 7 --max-time 15 -H 'Cache-Control: no-cache' "$url" -o /tmp/revision.json; then
              if node -e 'const x=JSON.parse(require("node:fs").readFileSync("/tmp/revision.json","utf8"));process.exit(x.source_sha===process.argv[1]&&x.scope==="ecdsa-symbolic-and-real-pairing-research-only"&&x.repository===process.argv[2]?0:1)' "$GITHUB_SHA" "$GITHUB_REPOSITORY"; then
                curl -fsSL --connect-timeout 7 --max-time 15 -H 'Cache-Control: no-cache' "${SITE}?audit=${GITHUB_SHA}-${i}" -o /tmp/preview.html
                grep -Fq 'content="0; url=./real/"' /tmp/preview.html
                curl -fsSL --connect-timeout 7 --max-time 15 -H 'Cache-Control: no-cache' "${SITE}ordinary.html?audit=${GITHUB_SHA}-${i}" -o /tmp/ordinary-preview.html
                grep -Fq 'Chapter 01 is working. The full confirmer protocol is still being built.' /tmp/ordinary-preview.html
                grep -Fq 'The separate protocol where Carol proves a signature valid or invalid is <b>not yet implemented</b>' /tmp/ordinary-preview.html
                curl -fsSL --connect-timeout 7 --max-time 15 -H 'Cache-Control: no-cache' "${SITE}symbolic/?audit=${GITHUB_SHA}-${i}" -o /tmp/symbolic-preview.html
                grep -Fq 'NOT SECURE CRYPTOGRAPHY OR A FINISHED DESIGNATED CONFIRMER SIGNATURE' /tmp/symbolic-preview.html
                grep -Fq 'does <b>not</b> implement disavowal' /tmp/symbolic-preview.html
                grep -Fq 'id="attack-lab"' /tmp/symbolic-preview.html
                grep -Fq 'id="forge"' /tmp/symbolic-preview.html
                grep -Fq 'interactive 2013 OR-confirmation workbench' /tmp/ordinary-preview.html
                curl -fsSL --connect-timeout 7 --max-time 15 -H 'Cache-Control: no-cache' "${SITE}symbolic/dcs-uv-symbolic.mjs?audit=${GITHUB_SHA}-${i}" -o /tmp/served-symbolic.mjs
                expected="$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/revision.json","utf8")).symbolic_sha256')"
                actual="$(sha256sum /tmp/served-symbolic.mjs | cut -d' ' -f1)"
                test "$expected" = "$actual"
                curl -fsSL --connect-timeout 7 --max-time 15 -H 'Cache-Control: no-cache' "${SITE}real/?audit=${GITHUB_SHA}-${i}" -o /tmp/real-preview.html
                grep -Fq 'REAL CRYPTOGRAPHIC ARITHMETIC — NOT A FINISHED OR SECURITY-PROVEN DCS' /tmp/real-preview.html
                grep -Fq 'candidate reconstruction' /tmp/real-preview.html
                grep -Fq 'id="challenge-eve"' /tmp/real-preview.html
                grep -Fq 'id="download"' /tmp/real-preview.html
                grep -Fq 'id="formal-evidence"' /tmp/real-preview.html
                grep -Fq 'Kernel-checked mathematics' /tmp/real-preview.html
                grep -Fq 'Can you trust' /tmp/real-preview.html
                real_asset="$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/revision.json","utf8")).real_asset')"
                real_expected="$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/revision.json","utf8")).real_sha256')"
                curl -fsSL --connect-timeout 7 --max-time 25 -H 'Cache-Control: no-cache' "${SITE}real/assets/${real_asset}?audit=${GITHUB_SHA}-${i}" -o /tmp/served-real.js
                test "$real_expected" = "$(sha256sum /tmp/served-real.js | cut -d' ' -f1)"
                echo "Verified THREE served research experiences and both exact mathematical JavaScript bundles."
                exit 0
              fi
            fi
            sleep 6
          done
          echo "::error::The Pages site is not serving the exact reviewed research-preview and symbolic module."
          exit 1
