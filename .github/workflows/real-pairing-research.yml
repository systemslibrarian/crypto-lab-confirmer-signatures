name: Real BLS12-381 pairing research (source-audited, NOT full DCS)
on:
  push:
    branches: [main]
    paths:
      - 'research/real-pairing/**'
      - 'tests/real_pairing_browser.py'
      - '.github/workflows/real-pairing-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned reviewed cryptography dependency
        working-directory: research/real-pairing
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Run actual pairing, signing and adversarial fixtures
        working-directory: research/real-pairing
        run: |
          set -euo pipefail
          npm test | tee /tmp/dcs-real-pairing.tap
          grep -Eq '^# tests ([7-9]|[1-9][0-9]+)$' /tmp/dcs-real-pairing.tap
          ! grep -Eq '^# fail [1-9]' /tmp/dcs-real-pairing.tap
      - name: Bundle an offline-capable static real-pairing research workbench
        working-directory: research/real-pairing
        run: npm run build
      - name: Verify compiled HTML and assets retain both paper uncertainty and security gate
        run: |
          set -euo pipefail
          test -s dist/real/index.html
          grep -Fq 'Real cryptography. Experimental protocol. Built for learning and research.' dist/real/index.html
          grep -Fq 'These checks do not establish the security of the complete designated-confirmer signature scheme.' dist/real/index.html
          grep -Fq 'candidate reconstruction' dist/real/index.html
          find dist/real/assets -name '*.js' -size +10k | grep -q .
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.57.0 -r research/real-pairing/reference/requirements.txt
          python -m playwright install chromium
      - name: Reproduce vectors and check with a separate library and symbolic algebra
        run: |
          set -euo pipefail
          node research/real-pairing/reference/generate-vectors.mjs --check
          python -m unittest discover -s research/real-pairing/reference -p 'test_reference.py' -v
          python research/real-pairing/reference/check_algebra.py
      - name: Verify actual real-pairing browser controls on mobile and desktop
        run: python -m unittest discover -s tests -p 'real_pairing_browser.py' -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signature-gate-real-pairing-screenshots
          path: test-results/dcs-real-pairing-*.png
          if-no-files-found: ignore
      - name: Do not mistake reviewed math primitives for an audited full DCS
        run: |
          set -eu
          grep -q 'NOT a production DCS' research/real-pairing/core.mjs
          grep -q 'independent security review' research/real-pairing/core.mjs
          test ! -f research/real-pairing/deploy.yml
