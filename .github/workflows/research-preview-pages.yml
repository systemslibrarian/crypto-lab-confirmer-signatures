name: Research preview — ECDSA and symbolic 2013 OR confirmation
on:
  pull_request:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'tests/**'
      - 'research/dcs-uv-symbolic.mjs'
      - '.github/workflows/research-preview-pages.yml'
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'research/dcs-uv-symbolic.mjs'
      - '.github/workflows/research-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: signature-research-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-scope-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Real ECDSA and research-only unit tests
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs | tee /tmp/tests.tap
          grep -Eq '^# tests (11[1-9]|1[2-9][0-9]|[2-9][0-9]{2,})$' /tmp/tests.tap
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Play genuine ECDSA and source-specific symbolic OR math at both widths
        run: python -m unittest discover -s tests -p 'browser_flow.py' -v
      - name: Package ONLY ECDSA and plainly insecure symbolic 2013 math
        run: |
          set -euo pipefail
          test ! -e prototype/dcs.mjs
          test ! -e prototype/confirmer.mjs
          grep -Fq 'Chapter 01 is working. The full confirmer protocol is still being built.' prototype/index.html
          grep -Fq 'The separate protocol where Carol proves a signature valid or invalid is <b>not yet implemented</b>' prototype/index.html
          grep -Fq '<small>NOT IMPLEMENTED</small>' prototype/index.html
          mkdir -p dist
          cp prototype/index.html prototype/style.css prototype/app.mjs prototype/crypto.mjs dist/
          mkdir -p dist/symbolic
          cp prototype/symbolic/index.html prototype/symbolic/app.mjs dist/symbolic/
          cp research/dcs-uv-symbolic.mjs dist/symbolic/dcs-uv-symbolic.mjs
          cmp -s research/dcs-uv-symbolic.mjs dist/symbolic/dcs-uv-symbolic.mjs
          grep -Fq 'NOT SECURE CRYPTOGRAPHY OR A FINISHED DESIGNATED CONFIRMER SIGNATURE' dist/symbolic/index.html
          grep -Fq 'does <b>not</b> implement disavowal' dist/symbolic/index.html
          touch dist/.nojekyll
          SYMBOLIC_SHA="$(sha256sum dist/symbolic/dcs-uv-symbolic.mjs | cut -d' ' -f1)"
          printf '{"source_sha":"%s","scope":"ecdsa-and-insecure-symbolic-2013-research-only","repository":"%s","symbolic_sha256":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$SYMBOLIC_SHA" > dist/revision.json
          test ! -e dist/research
          test ! -e dist/tests
          echo "Research preview ready: no full DCS or affirmative disavowal is claimed."
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with: { path: dist }

  publish-preview:
    if: github.event_name != 'pull_request'
    needs: prove-scope-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v5
      - name: Confirm that PUBLIC Pages serves this exact reviewed preview
        env:
          SITE: https://systemslibrarian.github.io/crypto-lab-confirmer-signatures/
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            url="${SITE}revision.json?audit=${GITHUB_SHA}-${i}"
            if curl -fsSL --connect-timeout 7 --max-time 15 -H 'Cache-Control: no-cache' "$url" -o /tmp/revision.json; then
              if node -e 'const x=JSON.parse(require("node:fs").readFileSync("/tmp/revision.json","utf8"));process.exit(x.source_sha===process.argv[1]&&x.scope==="ecdsa-and-insecure-symbolic-2013-research-only"&&x.repository===process.argv[2]?0:1)' "$GITHUB_SHA" "$GITHUB_REPOSITORY"; then
                curl -fsSL --connect-timeout 7 --max-time 15 -H 'Cache-Control: no-cache' "${SITE}?audit=${GITHUB_SHA}-${i}" -o /tmp/preview.html
                grep -Fq 'Chapter 01 is working. The full confirmer protocol is still being built.' /tmp/preview.html
                grep -Fq 'The separate protocol where Carol proves a signature valid or invalid is <b>not yet implemented</b>' /tmp/preview.html
                curl -fsSL --connect-timeout 7 --max-time 15 -H 'Cache-Control: no-cache' "${SITE}symbolic/?audit=${GITHUB_SHA}-${i}" -o /tmp/symbolic-preview.html
                grep -Fq 'NOT SECURE CRYPTOGRAPHY OR A FINISHED DESIGNATED CONFIRMER SIGNATURE' /tmp/symbolic-preview.html
                grep -Fq 'does <b>not</b> implement disavowal' /tmp/symbolic-preview.html
                curl -fsSL --connect-timeout 7 --max-time 15 -H 'Cache-Control: no-cache' "${SITE}symbolic/dcs-uv-symbolic.mjs?audit=${GITHUB_SHA}-${i}" -o /tmp/served-symbolic.mjs
                expected="$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/revision.json","utf8")).symbolic_sha256')"
                actual="$(sha256sum /tmp/served-symbolic.mjs | cut -d' ' -f1)"
                test "$expected" = "$actual"
                echo "Verified BOTH served research pages and exact symbolic source bytes."
                exit 0
              fi
            fi
            sleep 6
          done
          echo "::error::The Pages site is not serving the exact reviewed research-preview and symbolic module."
          exit 1
