name: Research-only ordinary signature and toy arithmetic
on:
  pull_request:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'research/**'
      - 'tests/**'
      - '.github/workflows/research-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'research/**'
      - 'tests/**'
      - '.github/workflows/research-prototype.yml'
permissions:
  contents: read
jobs:
  ordinary-signature:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Published ECDSA vector and research-only labeled-Paillier / pi0 tests
        run: |
          set -o pipefail
          node --test tests/*.test.mjs | tee /tmp/research-tests.tap
          # Count distinct tests, not a green job that ran zero tests.
          grep -Eq '^# tests (7[8-9]|[8-9][0-9]|[1-9][0-9]{2,})$' /tmp/research-tests.tap
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser-only test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Run actual ordinary signature browser lesson on desktop and mobile
        run: python -m unittest discover -s tests -p 'browser_flow.py' -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signature-gate-stage-one-screenshots
          path: test-results/
          if-no-files-found: ignore
      - name: Refuse any fake DCS or research-site deployment
        run: |
          set -eu
          test ! -f .github/workflows/deploy.yml
          ! grep -Eiq 'import .*from .*(sign-then-encrypt-dcs|fake-confirm|fake-disavow)' prototype/app.mjs
          grep -q 'does <b>not</b> implement a designated confirmer signature' prototype/index.html
          grep -q 'RESEARCH-GATED' prototype/index.html
          grep -q 'NOT a complete DCS construction' research/THESIS-EQUATIONS.md
          grep -q 'deliberately TINY' research/cs-paillier.mjs
          grep -q 'RESEARCH ONLY' research/pi0-equality.mjs
          grep -q 'DOES NOT authenticate' research/pi0-equality.mjs
          grep -q 'NOT interactive confirmation' research/pi1-relation.mjs
          grep -q 'NOT a confirmation protocol' research/PI1-WITNESS-RELATION.md
          grep -q 'RESEARCH ONLY' research/pi1-interactive-toy.mjs
          grep -q 'NOT DCS' research/pi1-interactive-toy.mjs
          grep -q 'NO-GO' research/PI1-TRANSCRIPT.md
          grep -q 'RESEARCH ONLY' research/pi1-special-soundness.mjs
          grep -q 'NOT a completed DCS' research/PI1-SPECIAL-SOUNDNESS.md
          grep -q 'RESEARCH ONLY' research/disavow-branches.mjs
          grep -q 'NOT A DISAVOWAL PROOF' research/disavow-branches.mjs
          grep -q 'NOT an affirmative proof' research/DISAVOWAL-BRANCHES.md
          grep -q 'OPEN SPECIFICATION DISCREPANCY' research/SOURCE-RECONCILIATION.md
          echo 'Research-only guard holds: no complete DCS, no Pages publisher'
